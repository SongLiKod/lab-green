plugins {
    id 'com.android.application'
}

android {
    namespace 'com.labgreen.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.labgreen.app"
        minSdk 24
        targetSdk 34
        versionCode 10000
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!CVS:*'
    }
}

dependencies {
}
